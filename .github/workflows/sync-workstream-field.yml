name: Sync workstream field

# Centralized reconcile: sweeps the OrgWide Work project (#10) and sets each
# card's Workstream field from its issue's `workstream:*` label. Also handles
# board membership: every open issue org-wide carrying a workstream:* label is
# added to the board — replacing GitHub's built-in auto-add, which is capped at
# one repo. Runs on a schedule and on manual dispatch — it is NOT per-issue, so
# expect up to ~5 min latency.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          # Needs Organization → Projects: Read and write, plus Repository →
          # Issues: Read (to read labels on the linked issues). The default
          # GITHUB_TOKEN can't reach org Projects, so a PAT/App token is required.
          # Store it as the PROJECT_SYNC_TOKEN secret.
          github-token: ${{ secrets.PROJECT_SYNC_TOKEN }}
          script: |
            const ORG = 'sorcery-labs';
            const PROJECT_NUMBER = 10;

            // 1. Resolve the project id + the Workstream field (id + option map).
            const meta = await github.graphql(`
              query($org:String!, $num:Int!) {
                organization(login:$org) {
                  projectV2(number:$num) {
                    id
                    field(name:"Workstream") {
                      ... on ProjectV2SingleSelectField { id options { id name } }
                    }
                  }
                }
              }`, { org: ORG, num: PROJECT_NUMBER });

            const project = meta.organization.projectV2;
            const field = project && project.field;
            if (!field) { core.setFailed('No "Workstream" single-select field on the project'); return; }

            // option name lowercased == the workstream label slug ("Super-duper" -> "super-duper")
            const optionBySlug = new Map(field.options.map(o => [o.name.toLowerCase(), o.id]));

            // 2. For each workstream, find every OPEN issue org-wide carrying that
            //    label, add it to the board (idempotent), and set its Workstream
            //    field. Membership rule = "has a workstream:* label". Unlabeled
            //    issues stay off the board; closed issues drop out (is:open), so
            //    auto-archive is never fought. Never clears a field (drafts safe).
            let scanned = 0, updated = 0;
            for (const [slug, optId] of optionBySlug) {
              const q = `org:${ORG} is:issue is:open label:"workstream:${slug}"`;
              let cursor = null;
              do {
                const res = await github.graphql(`
                  query($q:String!, $cursor:String) {
                    search(query:$q, type:ISSUE, first:100, after:$cursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes { ... on Issue { id } }
                    }
                  }`, { q, cursor });

                for (const issue of res.search.nodes) {
                  if (!issue || !issue.id) continue;
                  scanned++;
                  // Add to the board (no-op if already present) and read the
                  // item's current Workstream value in the same call.
                  const add = await github.graphql(`
                    mutation($p:ID!, $c:ID!) {
                      addProjectV2ItemById(input:{ projectId:$p, contentId:$c }) {
                        item {
                          id
                          fieldValueByName(name:"Workstream") {
                            ... on ProjectV2ItemFieldSingleSelectValue { optionId }
                          }
                        }
                      }
                    }`, { p: project.id, c: issue.id });

                  const item = add.addProjectV2ItemById.item;
                  if ((item.fieldValueByName && item.fieldValueByName.optionId) === optId) continue;
                  await github.graphql(`
                    mutation($p:ID!, $i:ID!, $f:ID!, $o:String!) {
                      updateProjectV2ItemFieldValue(input:{
                        projectId:$p, itemId:$i, fieldId:$f, value:{ singleSelectOptionId:$o }
                      }) { projectV2Item { id } }
                    }`, { p: project.id, i: item.id, f: field.id, o: optId });
                  updated++;
                }
                cursor = res.search.pageInfo.hasNextPage ? res.search.pageInfo.endCursor : null;
              } while (cursor);
            }

            core.info(`Scanned ${scanned} labeled open issues; set ${updated} fields.`);
